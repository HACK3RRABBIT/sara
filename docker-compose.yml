services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sara
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - sara_pg:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara -d sara"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://sara:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/sara
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sara_pg:
